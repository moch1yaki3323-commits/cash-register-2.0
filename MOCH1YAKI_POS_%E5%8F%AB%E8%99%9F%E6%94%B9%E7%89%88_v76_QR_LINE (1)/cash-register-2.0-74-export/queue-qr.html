<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PF45｜排隊 QR Code</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft JhengHei',sans-serif;background:#f5f4f0;color:#455b4d;display:grid;place-items:center;min-height:100dvh;margin:0}.card{width:min(92vw,430px);text-align:center;border:1px solid #dae4da;border-radius:24px;padding:35px 22px;background:#fff;box-shadow:0 12px 35px #35483a11}.kicker{font-weight:800;letter-spacing:.2em;color:#889d8e;font-size:12px}.title{font-size:30px;font-weight:800;margin:14px 0 5px}.sub{font-size:15px;line-height:1.5;color:#738578;margin:7px 0 20px}.qr{width:282px;height:282px;margin:0 auto;border:1px solid #e3e8e3;display:flex;align-items:center;justify-content:center;padding:12px}.qr img,.qr canvas{max-width:100%}.url{font-size:12px;word-break:break-all;color:#819287;margin-top:20px}button{padding:12px 25px;border-radius:12px;background:#638772;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:20px}.msg{font-size:13px;color:#a15f53}@media print{body{background:white;min-height:unset}.card{box-shadow:none;width:420px;border:0}button{display:none}}</style></head><body><div class="card"><div class="kicker">PF45 • AYAMI × YAKI</div><div class="title">掃碼領號排隊</div><div class="sub">現場掃描 QR Code → 自助領號<br>LINE 叫號通知自由選擇</div><div id="qr" class="qr"><span>載入 QR Code 中…</span></div><p id="warning" class="msg"></p><div id="url" class="url"></div><button onclick="window.print()">列印 QR Code</button></div>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>const url=new URL('queue.html',location.href).href;document.getElementById('url').textContent=url;const qr=document.getElementById('qr');if(typeof QRCode==='function'&&!url.startsWith('file:')){qr.textContent='';new QRCode(qr,{text:url,width:256,height:256,colorDark:'#25392c',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}else{qr.textContent='QR Code 尚未產生';document.getElementById('warning').textContent=location.protocol==='file:'?'請先將網站部署至 HTTPS 網址後，再列印 QR Code。':'無法載入 QR Code 元件，請檢查網路連線。';}</script></body></html>
